<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAIN_FRAME: GLOBAL_THREAT_INTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --neon-red-high: #ff7070;
            --neon-orange: #ff9f1c;
            --bg-dark: #050b14;
            --panel-bg: rgba(10, 25, 47, 0.75);
            --panel-border: rgba(0, 240, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; user-select: none; }
        body { background-color: var(--bg-dark); color: #ffffff; overflow: hidden; height: 100vh; width: 100vw; }
        #hud-container { display: grid; grid-template-columns: 48% 52%; height: 100vh; width: 100vw; position: relative; }

        #globe-viewport { width: 100%; height: 100%; position: relative; background: radial-gradient(circle at center, #0a192f 0%, #050b14 100%); overflow: hidden; }

        #globe-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 48%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        #globe-title { position: absolute; top: 25px; left: 25px; text-shadow: 0 0 10px var(--neon-cyan); border-left: 3px solid var(--neon-cyan); padding-left: 15px; }
        #globe-title h1 { font-size: 1.6rem; color: var(--neon-cyan); letter-spacing: 2px; }

        #globe-legend {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            background: rgba(5, 11, 20, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.15);
            padding: 10px 14px;
            border-radius: 4px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: #8892b0; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .legend-dot.critical { background: #ff3131; box-shadow: 0 0 6px 2px rgba(255,49,49,0.9),  0 0 14px 5px rgba(255,49,49,0.4); }
        .legend-dot.high     { background: #ff7070; box-shadow: 0 0 6px 2px rgba(255,112,112,0.9), 0 0 14px 5px rgba(255,112,112,0.4); }
        .legend-dot.medium   { background: #ff9f1c; box-shadow: 0 0 6px 2px rgba(255,159,28,0.8),  0 0 12px 4px rgba(255,159,28,0.3); }
        .legend-dot.low      { background: #39ff14; box-shadow: 0 0 6px 2px rgba(57,255,20,0.8),   0 0 12px 4px rgba(57,255,20,0.3); }

        #matrix-panel { height: 100vh; border-left: 1px solid var(--panel-border); background: linear-gradient(180deg, rgba(5,11,20,0.6) 0%, rgba(10,25,47,0.9) 100%); display: flex; flex-direction: column; padding: 20px; overflow: hidden; }
        #stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--panel-bg); border: 1px solid var(--panel-border); padding: 12px; border-radius: 4px; text-align: center; box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05); }
        .stat-card p { font-size: 0.75rem; color: #8892b0; text-transform: uppercase; margin-bottom: 5px; }
        .stat-card h2 { font-size: 1.6rem; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
        .stat-card.alert h2 { color: #ff3131; text-shadow: 0 0 8px rgba(255,49,49,0.5); }
        .stat-card.warn h2  { color: #ff7070; text-shadow: 0 0 8px rgba(255,112,112,0.5); }

        #nav-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
        .tab-btn { background: transparent; border: 1px solid transparent; color: #8892b0; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s ease; }
        .tab-btn:hover { color: var(--neon-cyan); background: rgba(0, 240, 255, 0.05); }
        .tab-btn.active { color: var(--bg-dark); background: var(--neon-cyan); box-shadow: 0 0 8px rgba(0, 240, 255, 0.4); font-weight: bold; }

        #table-header { display: grid; grid-template-columns: 4% 10% 13% 7% 5% 16% 20% 25%; padding: 10px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--panel-border); font-size: 0.75rem; color: var(--neon-cyan); font-weight: bold; text-transform: uppercase; border-radius: 4px 4px 0 0; }
        #log-feed-container { flex-grow: 1; background: rgba(3, 8, 16, 0.85); border: 1px solid var(--panel-border); border-top: none; border-radius: 0 0 4px 4px; overflow-y: auto; }
        .feed-item { padding: 10px; border-bottom: 1px solid rgba(0, 240, 255, 0.05); font-size: 0.75rem; display: grid; grid-template-columns: 4% 10% 13% 7% 5% 16% 20% 25%; align-items: start; word-break: break-all; }
        .feed-item:hover { background: rgba(0, 240, 255, 0.04); }

        .feed-sn      { color: #4e5d78; padding-top: 2px; }
        .feed-node    { color: #8892b0; font-size: 0.7rem; padding-top: 2px; }
        .feed-summary { color: #8892b0; font-size: 0.7rem; line-height: 1.35; padding: 0 3px; }
        .feed-technique { line-height: 1.3; font-family: 'Consolas', monospace; color: #00f0ff; background: rgba(0, 240, 255, 0.03); padding: 4px; border-radius: 2px; border: 1px solid rgba(0, 240, 255, 0.05); font-size: 0.7rem; }

        .feed-severity-critical { color: #ff3131; font-weight: bold; font-size: 0.7rem; }
        .feed-severity-high     { color: #ff7070; font-weight: bold; font-size: 0.7rem; }
        .feed-severity-medium   { color: var(--neon-orange); font-weight: bold; font-size: 0.7rem; }
        .feed-severity-low      { color: var(--neon-green); font-size: 0.7rem; }
        .feed-score             { font-size: 0.85rem; font-weight: bold; }

        .feed-item.critical-row .feed-ip, .feed-item.critical-row .feed-class { color: #ff3131; font-weight: bold; }
        .feed-item.high-row     .feed-ip, .feed-item.high-row     .feed-class { color: #ff7070; font-weight: bold; }
        .feed-item.medium-row   .feed-ip, .feed-item.medium-row   .feed-class { color: var(--neon-orange); font-weight: bold; }
        .feed-item.low-row      .feed-ip, .feed-item.low-row      .feed-class { color: var(--neon-green); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }
    </style>
</head>
<body>

<div id="hud-container">
    <div id="globe-viewport"></div>
    <div id="globe-overlay">
        <div id="globe-title"><h1>THREAT_INTEL</h1></div>
        <div id="globe-legend">
            <div class="legend-item"><div class="legend-dot critical"></div><span>CRITICAL</span></div>
            <div class="legend-item"><div class="legend-dot high"></div><span>HIGH</span></div>
            <div class="legend-item"><div class="legend-dot medium"></div><span>MEDIUM</span></div>
            <div class="legend-item"><div class="legend-dot low"></div><span>LOW</span></div>
        </div>
    </div>

    <div id="matrix-panel">
        <div id="stats-grid">
            <div class="stat-card"><p>Total Probes</p><h2 id="stat-total">0</h2></div>
            <div class="stat-card"><p>Unique IPs</p><h2 id="stat-unique">0</h2></div>
            <div class="stat-card alert"><p>Critical</p><h2 id="stat-critical">0</h2></div>
            <div class="stat-card warn"><p>High</p><h2 id="stat-high">0</h2></div>
        </div>

        <div id="nav-tabs">
            <button class="tab-btn active" onclick="switchView('all')">ALL_DATA</button>
            <button class="tab-btn" onclick="switchView('critical')">CRITICAL</button>
            <button class="tab-btn" onclick="switchView('high')">HIGH</button>
            <button class="tab-btn" onclick="switchView('medium')">MEDIUM</button>
            <button class="tab-btn" onclick="switchView('low')">LOW</button>
        </div>

        <div id="table-header">
            <span>#</span><span>Node</span><span>IP</span><span>Severity</span><span>Score</span><span>Classification</span><span>Summary</span><span>Technique</span>
        </div>

        <div id="log-feed-container">
            <div id="log-feed"></div>
        </div>
    </div>
</div>

<script>
    let fullThreatDataset = [];
    let activeFilter = 'all';
    let globeEngine = null;

    const SEVERITY_RANK = { 'Critical': 4, 'High': 3, 'Medium': 2, 'Low': 1 };

    function isCritical(entry) { return entry.severity === 'Critical' || entry.risk_score >= 9; }
    function isHigh(entry)     { return !isCritical(entry) && (entry.severity === 'High' || entry.risk_score >= 7); }
    function isMedium(entry)   { return !isCritical(entry) && !isHigh(entry) && (entry.severity === 'Medium' || entry.risk_score >= 4); }
    function isLow(entry)      { return !isCritical(entry) && !isHigh(entry) && !isMedium(entry); }

    function getSeverityClass(entry) {
        if (isCritical(entry)) return 'critical';
        if (isHigh(entry))     return 'high';
        if (isMedium(entry))   return 'medium';
        return 'low';
    }

    function getScoreColor(score) {
        if (score >= 9) return '#ff3131';
        if (score >= 7) return '#ff7070';
        if (score >= 4) return '#ff9f1c';
        return '#39ff14';
    }

    function getSeverityVisuals(sevClass) {
        const DOT_RADIUS = 0.5;
        switch (sevClass) {
            case 'critical': return { color: '#ff3131', radius: DOT_RADIUS };
            case 'high':     return { color: '#ff7070', radius: DOT_RADIUS };
            case 'medium':   return { color: '#ff9f1c', radius: DOT_RADIUS };
            default:         return { color: '#39ff14', radius: DOT_RADIUS };
        }
    }

    function buildIpSeverityMap(data) {
        const ipMap = {};
        data.forEach(entry => {
            const ip   = entry.ip;
            const rank = SEVERITY_RANK[entry.severity] || 1;
            if (!ipMap[ip]) {
                ipMap[ip] = { topEntry: entry, topRank: rank, peakScore: entry.risk_score, totalAttacks: 0, classifications: [] };
            }
            if (rank > ipMap[ip].topRank || (rank === ipMap[ip].topRank && entry.risk_score > ipMap[ip].peakScore)) {
                ipMap[ip].topRank   = rank;
                ipMap[ip].topEntry  = entry;
                ipMap[ip].peakScore = entry.risk_score;
            }
            ipMap[ip].totalAttacks += (entry.total_attacks || 1);
            if (!ipMap[ip].classifications.includes(entry.classification)) {
                ipMap[ip].classifications.push(entry.classification);
            }
        });
        return ipMap;
    }

    function jitterCoord(coord, existing, jitterDeg = 0.6) {
        let lat = coord.lat;
        let lng = coord.lng;
        let attempts = 0;
        while (attempts < 20) {
            const clash = existing.some(e => Math.abs(e.lat - lat) < 0.4 && Math.abs(e.lng - lng) < 0.4);
            if (!clash) break;
            const angle = Math.random() * 2 * Math.PI;
            const dist  = jitterDeg * (0.5 + Math.random() * 0.5);
            lat = coord.lat + dist * Math.sin(angle);
            lng = coord.lng + dist * Math.cos(angle);
            attempts++;
        }
        return { lat, lng };
    }

    function initGlobeSpace() {
        const container = document.getElementById('globe-viewport');
        globeEngine = Globe()(container)
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl(null)
            .width(container.clientWidth)
            .height(container.clientHeight)
            .labelsData([])
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => '')
            .labelDotRadius(d => d.radius)
            .labelColor(d => d.color)
            .labelResolution(3)
            .labelIncludeDot(true)
            .labelLabel(d => d.infoPopup);

        window.addEventListener('resize', () => {
            globeEngine.width(container.clientWidth).height(container.clientHeight);
        });
        globeEngine.controls().autoRotate = false;
    }

    async function loadThreatIntel() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/Nanak011/threat_intel/main/threat_feed.json');
            fullThreatDataset = await response.json();
            calculateMetrics(fullThreatDataset);
            renderLogFeed(fullThreatDataset);
            await processTelemetryMapping(fullThreatDataset);
        } catch (err) { console.error("Critical Ingestion Fault.", err); }
    }

    function calculateMetrics(data) {
        document.getElementById('stat-total').innerText    = data.length;
        document.getElementById('stat-unique').innerText   = new Set(data.map(i => i.ip)).size;
        document.getElementById('stat-critical').innerText = data.filter(i => isCritical(i)).length;
        document.getElementById('stat-high').innerText     = data.filter(i => isHigh(i)).length;
    }

    async function processTelemetryMapping(entries) {
        const ipSeverityMap = buildIpSeverityMap(entries);
        const uniqueIps     = Object.keys(ipSeverityMap);
        const markersArray  = [];
        const placedCoords  = []; // track placed coords for jitter

        for (const ip of uniqueIps) {
            const ipData     = ipSeverityMap[ip];
            const topEntry   = ipData.topEntry;
            const sevClass   = getSeverityClass(topEntry);
            const visuals    = getSeverityVisuals(sevClass);
            const scoreColor = getScoreColor(ipData.peakScore);

            try {
                const res = await fetch(`https://free.freeipapi.com/api/json/${ip}`);
                const geo = await res.json();

                if (geo && geo.latitude) {
                    // Jitter if another IP already sits at this lat/lng
                    const jittered = jitterCoord({ lat: geo.latitude, lng: geo.longitude }, placedCoords);
                    placedCoords.push(jittered);

                    const classListHtml = ipData.classifications
                        .map(c => `<span style="color:#ccd6f6">• ${c}</span>`)
                        .join('<br>');

                    markersArray.push({
                        lat: jittered.lat,
                        lng: jittered.lng,
                        color: visuals.color,
                        radius: visuals.radius,
                        infoPopup: `<div style="text-align:left;font-family:'Share Tech Mono',monospace;line-height:1.6;min-width:220px;">
                            <strong style="color:${visuals.color};font-size:0.9rem;">[THREAT NODE DETECTED]</strong><br>
                            <strong>IP:</strong> ${ip}<br>
                            <strong>GEO:</strong> ${geo.cityName || 'Unknown'}, ${geo.countryName}<br>
                            <strong>NODE:</strong> ${topEntry.node || 'Unknown'}<br>
                            <hr style="border-color:rgba(255,255,255,0.1);margin:4px 0;">
                            <strong>HIGHEST SEVERITY:</strong> <span style="color:${visuals.color}">${topEntry.severity}</span><br>
                            <strong>PEAK RISK SCORE:</strong> <span style="color:${scoreColor}">${ipData.peakScore}/10</span><br>
                            <strong>TOTAL ATTACKS:</strong> ${ipData.totalAttacks}<br>
                            <hr style="border-color:rgba(255,255,255,0.1);margin:4px 0;">
                            <strong>CLASSIFICATIONS:</strong><br>${classListHtml}
                        </div>`
                    });

                    globeEngine.labelsData([...markersArray]);
                }
                await new Promise(resolve => setTimeout(resolve, 1200));
            } catch (err) { console.warn(`Geo-resolution missed for: ${ip}`); }
        }
    }

    function renderLogFeed(data) {
        const feedContainer = document.getElementById('log-feed');
        feedContainer.innerHTML = '';

        const filteredData = data.filter(entry => {
            if (activeFilter === 'all')      return true;
            if (activeFilter === 'critical') return isCritical(entry);
            if (activeFilter === 'high')     return isHigh(entry);
            if (activeFilter === 'medium')   return isMedium(entry);
            if (activeFilter === 'low')      return isLow(entry);
            return true;
        });

        filteredData.slice().reverse().forEach((entry, index) => {
            const row        = document.createElement('div');
            const sevClass   = getSeverityClass(entry);
            const scoreColor = getScoreColor(entry.risk_score);

            row.className = `feed-item ${sevClass}-row`;
            row.innerHTML = `
                <span class="feed-sn">#${filteredData.length - index}</span>
                <span class="feed-node">${entry.node || 'Unknown'}</span>
                <span class="feed-ip">${entry.ip}</span>
                <span class="feed-severity-${sevClass}">${entry.severity}</span>
                <span class="feed-score" style="color:${scoreColor}">${entry.risk_score}</span>
                <span class="feed-class">${entry.classification}</span>
                <span class="feed-summary">${entry.summary || ''}</span>
                <span class="feed-technique">${entry.technique || 'No Technical Data'}</span>
            `;
            feedContainer.appendChild(row);
        });
    }

    function switchView(viewType) {
        activeFilter = viewType;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.toLowerCase() === viewType);
        });
        renderLogFeed(fullThreatDataset);
    }

    initGlobeSpace();
    loadThreatIntel();
</script>
</body>
</html>
