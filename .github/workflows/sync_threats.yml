name: Hourly Threat Intel Sync Pipeline

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch: 

jobs:
  analyze-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pipeline Dependencies
        run: pip install requests google-genai pydantic

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Execute Gemini Intel Processing Script
        if: always() 
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - << 'EOF'
          import os
          import json
          import requests
          import sys
          from google import genai
          from google.genai import types
          from pydantic import BaseModel, Field
          from typing import List

          if "SUPABASE_URL" not in os.environ or "SUPABASE_SERVICE_KEY" not in os.environ:
              print(" ERROR: Environment variables missing!")
              sys.exit(1)

          URL = os.environ["SUPABASE_URL"]
          KEY = os.environ["SUPABASE_SERVICE_KEY"]
          HEADERS = {
              "apikey": KEY,
              "Authorization": f"Bearer {KEY}",
              "Content-Type": "application/json"
          }

          class AIAnalysisItem(BaseModel):
              id: int = Field(description="The exact database integer ID of the log record.")
              classification: str = Field(description="Threat classification (e.g., Vulnerability Scan, Web Scanner).")
              severity: str = Field(description="Strictly restricted to: Low, Medium, High, Critical.")
              risk_score: int = Field(description="Integer rating between 1 and 10.")
              summary: str = Field(description="1-sentence description of the threat intent. Do not echo the raw attack payload.")

          class AIBatchAnalysis(BaseModel):
              analyses: List[AIAnalysisItem]

          PROMPT_INSTRUCTION = (
              "You are an automated Cyber Threat Intelligence analyzer.\n"
              "Analyze the provided raw logs array and extract your analysis findings.\n"
              "CRITICAL: Map each entry using the exact original integer 'id'. Do NOT attempt to output or copy the raw attack payloads."
          )

          try:
              client = genai.Client(vertexai=True, project="intel-498005", location="us-central1")
          except Exception as e:
              print(f"GenAI Client Init Error: {e}")
              sys.exit(1)

          cycle = 1
          while True:
              print(f"\n [CYCLE {cycle}] Fetching batch of 40 unprocessed logs...")
              
              try:
                  supabase_rest = f"{URL}/rest/v1/intel_attacks?processed_by_ai=eq.false&limit=40"
                  db_res = requests.get(supabase_rest, headers=HEADERS, timeout=10)
                  attacks = db_res.json()
              except Exception as e:
                  print(f" Database Read Error on cycle {cycle}: {e}")
                  sys.exit(1)

              if not attacks:
                  print(f" SUCCESS: No further unprocessed logs found. Cleared backlog across {cycle - 1} cycles.")
                  break

              print(f" Fetched {len(attacks)} records from Supabase. Initiating AI matching processing...")
              processed_ids = [str(item['id']) for item in attacks]
              original_attacks_map = {item["id"]: item for item in attacks}

              try:
                  print(" Dispatching batch to Gemini (Analysis Only)...")
                  full_payload = f"{PROMPT_INSTRUCTION}\n\nRaw Logs:\n{json.dumps(attacks)}"
                  
                  response = client.models.generate_content(
                      model="gemini-2.5-flash",
                      contents=full_payload,
                      config=types.GenerateContentConfig(
                          response_mime_type="application/json",
                          response_schema=AIBatchAnalysis,
                          max_output_tokens=8192
                      )
                  )
                  
                  parsed_response = json.loads(response.text.strip())
                  ai_entries = parsed_response.get("analyses", [])
                  
                  stitched_records = []
                  for analysis in ai_entries:
                      log_id = analysis.get("id")
                      if log_id in original_attacks_map:
                          orig = original_attacks_map[log_id]
                          
                          formatted_entry = {
                              "timestamp": orig.get("created_at"),
                              "ip": orig.get("attacker_ip"),
                              "classification": analysis.get("classification"),
                              "severity": analysis.get("severity"),
                              "risk_score": analysis.get("risk_score"),
                              "summary": analysis.get("summary"),
                              "node": orig.get("node_name"),
                              "technique": orig.get("raw_payload"),
                              "total_attacks": orig.get("total_attacks", 1)
                          }
                          stitched_records.append(formatted_entry)

                  feed_filename = "threat_feed.json"
                  historical_data = []
                  if os.path.exists(feed_filename):
                      try:
                          with open(feed_filename, "r", encoding="utf-8") as f:
                              historical_data = json.load(f)
                          if not isinstance(historical_data, list):
                              historical_data = []
                      except:
                          historical_data = []

                  historical_data.extend(stitched_records)

                  with open(feed_filename, "w", encoding="utf-8") as f:
                      json.dump(historical_data, f, indent=2)
                      
                  print(f" Feed updated! Successfully committed {len(stitched_records)} items on cycle {cycle}.")

              except Exception as crash_error:
                  print(f" [BATCH SKIPPED] Gemini cut off or returned invalid structure on cycle {cycle}: {crash_error}")
                  print("Skipping this batch to maintain workflow continuity...")

              print(f" Flushing processed IDs for cycle {cycle} from the database queue...")
              update_url = f"{URL}/rest/v1/intel_attacks?id=in.({','.join(processed_ids)})"
              try:
                  update_res = requests.patch(update_url, json={"processed_by_ai": True}, headers=HEADERS, timeout=10)
                  print(f" Cycle {cycle} complete. Database synced. Status: {update_res.status_code}")
              except Exception as e:
                  print(f" Could not clear queue for cycle {cycle}: {e}")

              cycle += 1
          EOF

      - name: Commit and Push Updates to Repo
        if: always()
        run: |
          git config --global user.name "automated-threat-intel-bot"
          git config --global user.email "actions@github.com"
          git add threat_feed.json || true
          if git diff --staged --quiet; then
            echo "No structural logging changes detected."
          else
            git commit -m "Automated Multi-Node Intel Feed Update"
            git push origin main
          fi
